<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d36">
<meta name="description" content="タブレットで使う顧客アンケート。前回の回答を呼び出し、タップだけで送信できます。">
<title>かんげんアンケート</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar">
  <button id="back-btn" class="icon-btn" aria-label="戻る">‹</button>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">K</span>
    <span id="top-title" class="brand-title"></span>
  </div>
  <button id="sync-badge" class="sync-badge" data-act="nav" data-value="settings" hidden></button>
</header>

<main id="main" class="main"></main>

<nav id="tabbar" class="tabbar">
  <button class="tab" data-nav="home" data-act="nav" data-value="home"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg></span><span>ホーム</span></button>
  <button class="tab" data-nav="customers" data-act="nav" data-value="customers"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg></span><span>顧客</span></button>
  <button class="tab" data-nav="stats" data-act="nav" data-value="stats"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11"/><path d="M10 20V4"/><path d="M16 20v-6"/><path d="M2 20h20"/></svg></span><span>集計</span></button>
  <button class="tab" data-nav="inventory" data-act="nav" data-value="inventory"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M4 7.5 12 12l8-4.5"/><path d="M12 12v9"/></svg></span><span>在庫</span></button>
  <button class="tab" data-nav="settings" data-act="nav" data-value="settings"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.4" fill="var(--bg-soft)"/><circle cx="15" cy="17" r="2.4" fill="var(--bg-soft)"/></svg></span><span>設定</span></button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="assets/survey.js"></script>
<script src="assets/store.js"></script>
<script src="assets/inventory.js"></script>
<script src="assets/app.js"></script>
<script src="assets/inventory-ui.js"></script>
</body>
</html>
